# ArchitectureVersion: one immutable snapshot of a Project's architecture graph.
# The node/edge model mirrors web/viewer-prototype/graph-diff.mjs (branch
# viewer/prototype):
#   node: { id, layer: network|code|data, kind, name, detail: 1..3,
#           parent?: node id, props?: {k: string|number|boolean}, pos: {x, z} }
#   edge: { from, to, kind, label? }
# Layer values keep the viewer's lowercase spelling so graphs can be passed
# between the viewer and the API without translation.
#
# Every version is a new object; nothing is edited in place. The whole spec is
# immutable (CEL transition rule self == oldSelf). There is no status
# subresource: nothing about a version changes after it is created.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: architectureversions.laoban.yansheng133.github.io
  {{- include "laoban-crd.metadata" . | nindent 2 }}
spec:
  group: laoban.yansheng133.github.io
  scope: Namespaced
  names:
    kind: ArchitectureVersion
    listKind: ArchitectureVersionList
    plural: architectureversions
    singular: architectureversion
    shortNames:
      - lbav
    categories:
      - laoban
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .spec.project
        - name: Version
          type: integer
          jsonPath: .spec.version
        - name: Parent
          type: integer
          jsonPath: .spec.parent
        - name: Author
          type: string
          jsonPath: .spec.author
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: One immutable version of a Project's architecture graph.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: ArchitectureVersion is immutable; create a new version instead
                - rule: "!has(self.parent) || self.parent < self.version"
                  message: parent must be an earlier version number
              required:
                - project
                - version
                - author
                - nodes
                - edges
              properties:
                project:
                  description: Rancher Project ID, <cluster ID>:<project ID>.
                  type: string
                  minLength: 3
                  maxLength: 253
                  pattern: '^[^:\s]+:[^:\s]+$'
                version:
                  description: Version number within the Project, starting at 1.
                  type: integer
                  format: int32
                  minimum: 1
                parent:
                  description: Version number this version was derived from. Absent for the first version.
                  type: integer
                  format: int32
                  minimum: 1
                author:
                  description: Rancher principal ID of the author.
                  type: string
                  minLength: 1
                  maxLength: 512
                note:
                  description: Short description per language tag (for example zh-TW, en, ja).
                  type: object
                  maxProperties: 8
                  additionalProperties:
                    type: string
                    maxLength: 2048
                nodes:
                  type: array
                  maxItems: 500
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - id
                  items:
                    type: object
                    required:
                      - id
                      - layer
                      - kind
                      - name
                      - detail
                      - pos
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 128
                      layer:
                        type: string
                        enum:
                          - network
                          - code
                          - data
                      kind:
                        description: Node kind, for example ingress, service, app, module, database, table, queue.
                        type: string
                        minLength: 1
                        maxLength: 63
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                      detail:
                        description: Lowest zoom level (1 = coarsest) at which the node is shown.
                        type: integer
                        minimum: 1
                        maximum: 3
                      parent:
                        description: id of the enclosing node, if any.
                        type: string
                        minLength: 1
                        maxLength: 128
                      props:
                        description: >-
                          Free-form display properties. Values should be strings,
                          numbers or booleans (not enforced by the schema).
                        type: object
                        maxProperties: 32
                        additionalProperties:
                          x-kubernetes-preserve-unknown-fields: true
                      pos:
                        description: Layout position on the viewer's ground plane.
                        type: object
                        required:
                          - x
                          - z
                        properties:
                          x:
                            type: number
                          z:
                            type: number
                edges:
                  type: array
                  maxItems: 2000
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - from
                    - to
                    - kind
                  items:
                    type: object
                    required:
                      - from
                      - to
                      - kind
                    properties:
                      from:
                        type: string
                        minLength: 1
                        maxLength: 128
                      to:
                        type: string
                        minLength: 1
                        maxLength: 128
                      kind:
                        description: Edge kind, for example routes, calls, reads, writes, protects.
                        type: string
                        minLength: 1
                        maxLength: 63
                      label:
                        type: string
                        maxLength: 253
