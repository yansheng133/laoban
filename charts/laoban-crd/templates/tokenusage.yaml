# TokenUsage: the AI tokens used in one month (UTC), written only by the
# laoban backend so the monthly cap (config.tokenCap) is not reset by a
# restart (v0.1.19). One object per month, named tokens-YYYY-MM; old months
# are kept (they are small) so the usage can be looked up later.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tokenusages.laoban.yansheng133.github.io
  {{- include "laoban-crd.metadata" . | nindent 2 }}
spec:
  group: laoban.yansheng133.github.io
  scope: Namespaced
  names:
    kind: TokenUsage
    listKind: TokenUsageList
    plural: tokenusages
    singular: tokenusage
    shortNames:
      - lbtokens
    categories:
      - laoban
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Month
          type: string
          jsonPath: .spec.period
        - name: Tokens
          type: integer
          jsonPath: .spec.tokens
      schema:
        openAPIV3Schema:
          description: AI tokens used in one month, kept by the laoban backend across restarts.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - schema
                - period
                - tokens
              properties:
                schema:
                  type: integer
                  minimum: 1
                period:
                  description: The month, YYYY-MM (UTC).
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}$'
                tokens:
                  description: Tokens settled in that month (input plus output).
                  type: integer
                  minimum: 0
