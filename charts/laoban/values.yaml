# Default values for the laoban backend.
# No secrets go in this file: credentials are read from existing Secrets by name.

# PoC: one replica. The audit spool is a ReadWriteOnce volume, so more than one
# replica needs a different spool design first (HA is a later phase).
replicaCount: 1

image:
  # Public GitHub Container Registry package published by .github/workflows/image.yml.
  # Use docker.io/<namespace>/laoban-server for the optional Docker Hub copy.
  repository: ghcr.io/yansheng133/laoban-server
  # Required. Images are always pulled by digest, e.g. "sha256:<64 hex chars>".
  digest: ""
  # Informational only (shown in labels); never used to pull.
  tag: ""
  pullPolicy: IfNotPresent

# Needed only while the GHCR package is still private (see build/README.md).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Name of the ServiceAccount to create. Defaults to the full name.
  name: ""
  annotations: {}

# Identity delegation (phase 1, not M0): the backend acts as the signed-in
# Rancher user through Kubernetes impersonation. When disabled (M0 default) the
# chart renders no RBAC objects at all and the pod gets no ServiceAccount token:
# the backend does not call any Kubernetes API.
impersonation:
  enabled: false
  # Rancher sets these extras on its own impersonation service accounts
  # (principal ID and username). Keep both so audit records match Rancher's.
  userExtras:
    - principalid
    - username

# The backend serves its API as a Kubernetes aggregated API
# (api.laoban.yansheng133.github.io/v1alpha1), so the API server verifies who
# is calling and checks RBAC before a request reaches it (docs/m0-design.md).
aggregatedApi:
  enabled: true
  # Container and Service port of the TLS API endpoint.
  port: 8443
  # Add the API's rules to the built-in edit/admin/view ClusterRoles.
  aggregateToDefaultRoles: true

# The backend has no Ingress. The UI extension reaches it through Rancher's
# Kubernetes API proxy (see README).
service:
  port: 8080

containerPort: 8080

probes:
  # Assumption: the backend serves an unauthenticated health endpoint on the
  # container port. Change if the server uses a different path.
  path: /healthz
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Audit-log spool: records wait here until the syslog target accepts them.
# M0 default: disabled (emptyDir), M0 does not forward audit records.
persistence:
  enabled: false
  # Required when enabled: always name the StorageClass. Relying on the cluster
  # default is not safe because some clusters have none (the rke2 downstream
  # cluster does not), and the PVC would stay Pending. local-path has no snapshots and is
  # tied to one node; syslog is the durable copy of the audit log.
  storageClass: local-path
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /var/spool/laoban

# Where the AI calls go.
ai:
  # Empty: the Anthropic API. Otherwise the base URL (scheme, host, optional
  # port) of an Anthropic Messages API compatible endpoint, for example a local
  # Ollama server: http://<host>:11434 (LAOBAN_AI_BASE_URL). Requests to it are
  # plain HTTP when the URL is http://, so keep it on a private network.
  baseUrl: ""
  # Upper bound for one AI call, 30 to 1800 (LAOBAN_AI_TIMEOUT_SECONDS).
  # Local models are slower; 900 is a reasonable value for them.
  timeoutSeconds: 300

# Anthropic API key, read from an existing Secret. Never put the key here.
anthropic:
  # Required unless ai.baseUrl is set. Name of an existing Secret in the
  # release namespace.
  existingSecret: ""
  # Key inside that Secret.
  secretKey: api-key

# M0 backend settings (environment variables, see docs/m0-design.md).
config:
  # Required. Model ID (LAOBAN_MODEL), never hard-coded in the backend: an
  # Anthropic model ID, or the endpoint's own name for a local model.
  model: ""
  # Monthly token cap enforced by laoban itself (LAOBAN_TOKEN_CAP).
  tokenCap: 2000000
  # Namespace the generated apps are deployed to by Fleet (LAOBAN_TARGET_NAMESPACE).
  targetNamespace: laoban-dev
  # Rancher cluster ID of the target cluster, used to build app URLs (LAOBAN_CLUSTER_ID).
  clusterId: c-m-26kbxk5f

# Rounds of 意見收斂. They are stored in Round resources (laoban-crd chart) in
# the release namespace; without that CRD the page says so and rounds wait.
rounds:
  # Size limits. Empty keeps the built-in value, which is also the highest
  # allowed: they may only be lowered (rendering fails otherwise), because
  # all of a round goes to the AI and is stored in one resource.
  limits:
    # One opinion, characters (built-in and highest: 1000).
    opinionChars:
    # One reply, characters (300).
    replyChars:
    # All opinions and replies of a round together, characters (8000).
    roundChars:
    # Opinions in a round (30).
    opinions:
    # Replies under one opinion (20).
    replies:

# GitHub repository the generated apps are committed to.
github:
  # Required. "<owner>/<repo>" (LAOBAN_GITHUB_REPO).
  repo: ""
  # Required. Existing Secret in the release namespace holding a fine-grained
  # personal access token (Contents: read and write on that one repository).
  # Injected as LAOBAN_GITHUB_TOKEN. Never put the token here.
  existingSecret: ""
  secretKey: token

# Audit-log forwarding over syslog (TLS).
syslog:
  enabled: false
  host: ""
  port: 6514
  tls:
    enabled: true
    # Existing ConfigMap holding the CA bundle that signed the syslog server certificate.
    caConfigMap: ""
    caKey: ca.crt
    # Existing Secret of type kubernetes.io/tls with the client certificate (mTLS).
    # Leave empty when the syslog server does not require a client certificate.
    clientCertSecret: ""

# The laoban CRDs (laoban-crd chart) are not used in M0. When required is true,
# rendering fails unless the CRDs are installed (checked through
# .Capabilities.APIVersions; pass --api-versions to `helm template` offline).
crds:
  required: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
