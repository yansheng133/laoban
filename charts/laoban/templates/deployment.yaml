{{- include "laoban.crdCheck" . }}
{{- $aiBaseUrl := .Values.ai.baseUrl | default "" }}
{{- if and $aiBaseUrl (not (regexMatch "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$" $aiBaseUrl)) }}
{{- fail (printf "ai.baseUrl must be scheme, host and optional port only (the backend appends /v1/messages), got %q" $aiBaseUrl) }}
{{- end }}
{{- $aiTimeout := int .Values.ai.timeoutSeconds }}
{{- if or (lt $aiTimeout 30) (gt $aiTimeout 1800) }}
{{- fail (printf "ai.timeoutSeconds must be between 30 and 1800, got %d" $aiTimeout) }}
{{- end }}
{{- /* The key is only required when the calls go to the Anthropic API. */}}
{{- $anthropicSecret := .Values.anthropic.existingSecret }}
{{- if not $aiBaseUrl }}
{{- $anthropicSecret = required "anthropic.existingSecret is required: name of an existing Secret holding the Anthropic API key (the key itself never goes in values); or set ai.baseUrl for an Anthropic-compatible endpoint such as a local Ollama server" .Values.anthropic.existingSecret }}
{{- end }}
{{- $githubSecret := required "github.existingSecret is required: name of an existing Secret holding the GitHub fine-grained token (the token itself never goes in values)" .Values.github.existingSecret }}
{{- $githubRepo := required "github.repo is required: the <owner>/<repo> the generated apps are committed to" .Values.github.repo }}
{{- if not (regexMatch "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$" $githubRepo) }}
{{- fail (printf "github.repo must look like <owner>/<repo>, got %q" $githubRepo) }}
{{- end }}
{{- $model := required "config.model is required: the model ID (LAOBAN_MODEL)" .Values.config.model }}
{{- /* Round limits may only be lowered (see values.yaml). */}}
{{- $roundLimits := list
  (list "opinionChars" "LAOBAN_ROUND_MAX_OPINION_CHARS" 1000)
  (list "replyChars" "LAOBAN_ROUND_MAX_REPLY_CHARS" 300)
  (list "roundChars" "LAOBAN_ROUND_MAX_CHARS" 8000)
  (list "opinions" "LAOBAN_ROUND_MAX_OPINIONS" 30)
  (list "replies" "LAOBAN_ROUND_MAX_REPLIES" 20) }}
{{- $limits := (.Values.rounds | default dict).limits | default dict }}
{{- range $roundLimits }}
{{- $v := get $limits (index . 0) }}
{{- /* sprig's get gives "" for a missing key; YAML gives null for an empty one. */}}
{{- if not (or (kindIs "invalid" $v) (and (kindIs "string" $v) (eq $v ""))) }}
{{- if not (or (kindIs "float64" $v) (kindIs "int64" $v) (kindIs "int" $v)) }}
{{- fail (printf "rounds.limits.%s may only be lowered: a whole number from 1 to %d, got %v" (index . 0) (index . 2) $v) }}
{{- end }}
{{- if or (ne (float64 $v) (float64 (int $v))) (lt (int $v) 1) (gt (int $v) (index . 2)) }}
{{- fail (printf "rounds.limits.%s may only be lowered: a whole number from 1 to %d, got %v" (index . 0) (index . 2) $v) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.syslog.enabled (not .Values.syslog.host) }}
{{- fail "syslog.host is required when syslog.enabled is true" }}
{{- end }}
{{- if and .Values.syslog.enabled .Values.syslog.tls.enabled (not .Values.syslog.tls.caConfigMap) }}
{{- fail "syslog.tls.caConfigMap is required when syslog TLS is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laoban.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laoban.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The spool volume is ReadWriteOnce: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laoban.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laoban.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.image.tag .Values.podAnnotations }}
      annotations:
        {{- with .Values.image.tag }}
        # Informational only: the image is pulled by digest.
        laoban.yansheng133.github.io/image-tag: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "laoban.serviceAccountName" . }}
      {{- if or .Values.impersonation.enabled .Values.aggregatedApi.enabled }}
      # The backend reads kube-system/extension-apiserver-authentication at
      # startup (aggregated API) and, in phase 1, acts as the user.
      automountServiceAccountToken: true
      {{- else }}
      # The backend calls no Kubernetes API and has no RBAC; no token in the pod.
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: laoban-server
          image: {{ include "laoban.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.aggregatedApi.enabled }}
            - name: https
              containerPort: {{ .Values.aggregatedApi.port }}
              protocol: TCP
            {{- end }}
          env:
            # Contract with the Rust server (docs/m0-design.md). Keep in sync with its config.
            - name: LAOBAN_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.containerPort) | quote }}
            {{- if .Values.aggregatedApi.enabled }}
            - name: LAOBAN_TLS_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.aggregatedApi.port) | quote }}
            - name: LAOBAN_TLS_CERT_FILE
              value: /etc/laoban/apiserver-tls/tls.crt
            - name: LAOBAN_TLS_KEY_FILE
              value: /etc/laoban/apiserver-tls/tls.key
            {{- end }}
            - name: LAOBAN_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LAOBAN_SPOOL_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            {{- if $anthropicSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $anthropicSecret }}
                  key: {{ .Values.anthropic.secretKey }}
            {{- end }}
            {{- if $aiBaseUrl }}
            - name: LAOBAN_AI_BASE_URL
              value: {{ $aiBaseUrl | quote }}
            {{- end }}
            - name: LAOBAN_AI_TIMEOUT_SECONDS
              value: {{ $aiTimeout | toString | quote }}
            - name: LAOBAN_MODEL
              value: {{ $model | quote }}
            # int64 first: Helm reads numbers as float64 and would print 2e+06.
            - name: LAOBAN_TOKEN_CAP
              value: {{ int64 .Values.config.tokenCap | toString | quote }}
            - name: LAOBAN_GITHUB_REPO
              value: {{ $githubRepo | quote }}
            - name: LAOBAN_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $githubSecret }}
                  key: {{ .Values.github.secretKey }}
            - name: LAOBAN_TARGET_NAMESPACE
              value: {{ .Values.config.targetNamespace | quote }}
            - name: LAOBAN_CLUSTER_ID
              value: {{ required "config.clusterId is required: the Rancher ID of the cluster laoban runs in (the part after /c/ in its Rancher address, for example c-m-abcd1234)" .Values.config.clusterId | quote }}
            - name: LAOBAN_LANGUAGE
              value: {{ .Values.config.language | default "en" | quote }}
            {{- with .Values.apps }}
            {{- if .url }}
            - name: LAOBAN_APP_URL
              value: {{ .url | quote }}
            {{- with .ingressClassName }}
            - name: LAOBAN_APP_INGRESS_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .tlsSecretName }}
            {{- if not (hasPrefix "https://" $.Values.apps.url) }}
            {{- fail "apps.tlsSecretName needs an https:// apps.url" }}
            {{- end }}
            - name: LAOBAN_APP_TLS_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- else if or .ingressClassName .tlsSecretName }}
            {{- fail "apps.ingressClassName and apps.tlsSecretName need apps.url" }}
            {{- end }}
            {{- end }}
            {{- range $roundLimits }}
            {{- $v := get $limits (index . 0) }}
            {{- if not (or (kindIs "invalid" $v) (and (kindIs "string" $v) (eq $v ""))) }}
            - name: {{ index . 1 }}
              value: {{ int $v | toString | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.syslog.enabled }}
            - name: LAOBAN_SYSLOG_HOST
              value: {{ .Values.syslog.host | quote }}
            - name: LAOBAN_SYSLOG_PORT
              value: {{ .Values.syslog.port | quote }}
            - name: LAOBAN_SYSLOG_TLS
              value: {{ .Values.syslog.tls.enabled | quote }}
            {{- if .Values.syslog.tls.enabled }}
            - name: LAOBAN_SYSLOG_CA_FILE
              value: {{ printf "/etc/laoban/syslog-ca/%s" .Values.syslog.tls.caKey | quote }}
            {{- if .Values.syslog.tls.clientCertSecret }}
            - name: LAOBAN_SYSLOG_CLIENT_CERT_FILE
              value: /etc/laoban/syslog-client/tls.crt
            - name: LAOBAN_SYSLOG_CLIENT_KEY_FILE
              value: /etc/laoban/syslog-client/tls.key
            {{- end }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spool
              mountPath: {{ .Values.persistence.mountPath }}
            # readOnlyRootFilesystem: give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.aggregatedApi.enabled }}
            - name: apiserver-tls
              mountPath: /etc/laoban/apiserver-tls
              readOnly: true
            {{- end }}
            {{- if and .Values.syslog.enabled .Values.syslog.tls.enabled }}
            - name: syslog-ca
              mountPath: /etc/laoban/syslog-ca
              readOnly: true
            {{- if .Values.syslog.tls.clientCertSecret }}
            - name: syslog-client
              mountPath: /etc/laoban/syslog-client
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: spool
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "laoban.fullname" . }}-spool
          {{- else }}
          # Not persistent: spooled audit records are lost when the pod is deleted.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.aggregatedApi.enabled }}
        - name: apiserver-tls
          secret:
            secretName: {{ printf "%s-apiserver-tls" (include "laoban.fullname" .) }}
            # Group-readable: the process runs as a non-root user with fsGroup.
            defaultMode: 0440
        {{- end }}
        {{- if and .Values.syslog.enabled .Values.syslog.tls.enabled }}
        - name: syslog-ca
          configMap:
            name: {{ .Values.syslog.tls.caConfigMap }}
            items:
              - key: {{ .Values.syslog.tls.caKey }}
                path: {{ .Values.syslog.tls.caKey }}
        {{- if .Values.syslog.tls.clientCertSecret }}
        - name: syslog-client
          secret:
            secretName: {{ .Values.syslog.tls.clientCertSecret }}
            # Group-readable: the process runs as a non-root user with fsGroup.
            defaultMode: 0440
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
