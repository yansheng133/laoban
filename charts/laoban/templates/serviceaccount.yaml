apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "laoban.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laoban.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if not (or .Values.impersonation.enabled .Values.aggregatedApi.enabled) }}
# No RBAC is bound to this ServiceAccount and no token is mounted.
automountServiceAccountToken: false
{{- end }}
