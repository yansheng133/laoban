# ClusterIP only, no Ingress. The API port is reached by the Kubernetes API
# server (APIService, apiservice.yaml); the http port serves the probes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "laoban.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laoban.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "laoban.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.aggregatedApi.enabled }}
    - name: https
      port: {{ .Values.aggregatedApi.port }}
      targetPort: https
      protocol: TCP
    {{- end }}
