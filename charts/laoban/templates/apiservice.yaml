{{- /*
The backend as a Kubernetes aggregated API (docs/m0-design.md, "身分").

The UI calls /apis/api.laoban.yansheng133.github.io/v1alpha1/namespaces/<ns>/...
through Rancher's /k8s/clusters/<id> proxy. The API server of this cluster
authenticates the Rancher user, checks RBAC on this API group (see
aggregated-rbac.yaml), and forwards the request to the backend over TLS with
its proxy client certificate and the user in X-Remote-User / X-Remote-Group.

Serving certificate: a CA and a certificate for <service>.<namespace>.svc,
generated by Helm on first install and kept on upgrades (lookup); the CA goes
into the APIService caBundle so the API server verifies the backend. Offline
rendering (helm template) cannot look up and always generates new ones.
*/ -}}
{{- if .Values.aggregatedApi.enabled }}
{{- $svc := include "laoban.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $secretName := printf "%s-apiserver-tls" $svc }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "tls.crt") (index $existing.data "tls.key") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- $ca = index $existing.data "ca.crt" }}
{{- else }}
{{- $caObj := genCA "laoban-apiserver-ca" 3650 }}
{{- $dns := list (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $cert := genSignedCert (printf "%s.%s.svc" $svc $ns) nil $dns 3650 $caObj }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $caObj.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "laoban.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  # <version>.<group>; the group is fixed in the backend (identity::GROUP).
  name: v1alpha1.api.laoban.yansheng133.github.io
  labels:
    {{- include "laoban.labels" . | nindent 4 }}
spec:
  group: api.laoban.yansheng133.github.io
  version: v1alpha1
  service:
    namespace: {{ $ns }}
    name: {{ $svc }}
    port: {{ .Values.aggregatedApi.port }}
  caBundle: {{ $ca }}
  groupPriorityMinimum: 1000
  versionPriority: 15
{{- end }}
