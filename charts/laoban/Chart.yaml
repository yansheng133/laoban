apiVersion: v2
name: laoban
description: laoban backend service for the laoban Rancher UI extension (M0 runs in a downstream cluster).
type: application
# Chart version and app version follow the backend release (Cargo.toml
# workspace version, the v<version> tag); CI checks they match.
version: 0.1.13
appVersion: "0.1.13"
# Rancher Prime 2.15.2 supports Kubernetes v1.34 to v1.36:
# https://www.suse.com/suse-rancher/support-matrix/all-supported-versions/rancher-v2-15-2/
kubeVersion: ">= 1.34.0-0"
home: https://github.com/yansheng133/laoban
sources:
  - https://github.com/yansheng133/laoban
license: Apache-2.0
keywords:
  - rancher
  - ui-extension
annotations:
  # Rancher Apps & Marketplace annotations:
  # https://ranchermanager.docs.rancher.com/how-to-guides/new-user-guides/helm-charts-in-rancher/create-apps
  catalog.cattle.io/display-name: laoban
  # No catalog.cattle.io/auto-install of laoban-crd: M0 does not use the CRDs
  # (crds.required=false). Add "catalog.cattle.io/auto-install: laoban-crd=match"
  # back when the CRDs become required (phase 1).
  # The UI extension reaches the backend through a fixed Service address, so the
  # namespace and release name are fixed when installed from the Rancher UI.
  catalog.cattle.io/namespace: laoban-system
  catalog.cattle.io/release-name: laoban
  catalog.cattle.io/os: linux
  # Compatibility ranges (semver ranges, see
  # https://extensions.rancher.io/extensions/next/extensions-configuration).
  catalog.cattle.io/rancher-version: ">= 2.15.0-0 < 2.16.0-0"
  catalog.cattle.io/kube-version: ">= 1.34.0-0 < 1.37.0-0"
