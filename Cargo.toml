[workspace]
resolver = "2"
members = [
    "crates/laoban-audit",
    "crates/laoban-ai",
    "crates/laoban-m0",
    "crates/laoban-mask",
    "crates/laoban-mockhttp",
    "crates/laoban-policy",
    "crates/laoban-server",
]

[workspace.package]
version = "0.1.16"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yansheng133/laoban"
rust-version = "1.80"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Blocking HTTP client with rustls (no OpenSSL); gzip is not needed.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.11"
