[workspace]
resolver = "2"
members = [
    "crates/laoban-audit",
    "crates/laoban-mask",
    "crates/laoban-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yansheng133/laoban"
rust-version = "1.80"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
