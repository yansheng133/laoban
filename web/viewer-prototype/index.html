<style>
/* Layout: one working screen. Toolbar on top, 3D stage left, change list and inspector right; stacks on phones. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5d6b7a;
  --line: #d3dae2;
  --accent: #2f63a8;
  --accent-ink: #ffffff;
  --stage: #f7f9fb;
  --layer-network: #4a78c2;
  --layer-code: #6b7686;
  --layer-data: #2c8a87;
  --added: #23864f;
  --removed: #c2413a;
  --changed: #b97a0e;
  --moved: #7b5fc4;
  --edge: #8a96a5;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1a2029; --ink: #e4e9ef; --muted: #98a4b3; --line: #2c3541;
    --accent: #7fa8de; --accent-ink: #0f1620; --stage: #0e1217;
    --layer-network: #6f98dc; --layer-code: #9aa5b4; --layer-data: #4fb3ae;
    --added: #4cc27f; --removed: #ec6a62; --changed: #e0a43a; --moved: #a68ce8; --edge: #6d7a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1a2029; --ink: #e4e9ef; --muted: #98a4b3; --line: #2c3541;
  --accent: #7fa8de; --accent-ink: #0f1620; --stage: #0e1217;
  --layer-network: #6f98dc; --layer-code: #9aa5b4; --layer-data: #4fb3ae;
  --added: #4cc27f; --removed: #ec6a62; --changed: #e0a43a; --moved: #a68ce8; --edge: #6d7a8a;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 12px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px;
}
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
/* Fixed-width slots so switching language never moves the controls. */
.brand { display: flex; align-items: baseline; gap: 8px; flex: 0 0 auto; width: 22rem; min-width: 0; }
.brand h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar #lang { margin-left: auto; width: 8rem; }
.brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
.brand .tag { white-space: nowrap; flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; display: inline-block; min-width: 5.8em; }
.toggle > span { display: inline-block; min-width: 4.6em; }
.view-controls { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
.view-controls > * { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 8px; }
.view-controls .seg button { min-width: 6.6rem; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button.ver { font-family: var(--font-mono); font-size: 13px; }
.seg button.ver .lock { margin-left: 4px; opacity: 0.65; vertical-align: -1px; }

select { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 3px 6px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; }
.stage { position: relative; min-height: 360px; background: var(--stage); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; touch-action: none; }
.stage canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.node-label { font-size: 12px; padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; color: var(--ink); transform: translateY(-16px); }
.node-label.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.node-label .st { font-family: var(--font-mono); font-weight: 600; margin-right: 4px; }
.node-label.added .st { color: var(--added); } .node-label.removed .st { color: var(--removed); }
.node-label.changed .st { color: var(--changed); } .node-label.moved .st { color: var(--moved); }
.node-label.removed { text-decoration: line-through; color: var(--muted); }
.layer-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.edge-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--stage); padding: 0 3px; }

.overlay { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.mode { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px; font-size: 13px; }
.mode .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.mode.edit .dot { background: var(--added); }
.mode.dirty .dot { background: var(--changed); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

aside { display: grid; grid-template-rows: minmax(0, 1fr) 15rem 4.6rem; gap: 12px; min-height: 0; }
aside > .panel { overflow: auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 8px; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font-family: var(--font-mono); font-size: 12px; border-radius: 3px; padding: 1px 7px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.chip.added { color: var(--added); } .chip.removed { color: var(--removed); } .chip.changed { color: var(--changed); } .chip.moved { color: var(--moved); }
.risk { border-left: 3px solid var(--removed); padding: 6px 10px; margin: 0 0 10px; font-size: 13px; background: color-mix(in srgb, var(--removed) 8%, transparent); }
.risk strong { display: block; }
ul.changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
ul.changes button { width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 4px; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
ul.changes button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
ul.changes .mark { font-family: var(--font-mono); font-weight: 600; }
ul.changes .name { overflow-wrap: anywhere; }
ul.changes .hint { font-size: 11px; color: var(--muted); }
.added .mark { color: var(--added); } .removed .mark { color: var(--removed); } .changed .mark { color: var(--changed); } .moved .mark { color: var(--moved); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.delta { font-family: var(--font-mono); font-size: 12px; }
.delta del { color: var(--removed); } .delta ins { color: var(--added); text-decoration: none; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.inspect-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; overflow-wrap: anywhere; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; }
  aside { display: flex; flex-direction: column; }
  aside > .panel { overflow: visible; }
  .view-controls .seg button { min-width: 0; }
  .view-controls .group { flex-direction: column; align-items: flex-start; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<!-- ARTIFACT-BODY -->
<header class="bar">
  <div class="brand"><h1 id="title" data-i18n="title">架構視圖</h1><span class="tag">laoban / prototype</span></div>
  <div class="group"><span class="lbl" data-i18n="version">版本</span><div class="seg" id="versions" role="group"></div></div>
  <div class="group">
    <label class="toggle"><input type="checkbox" id="compare"><span data-i18n="compare">比較</span></label>
    <select id="base" aria-label="base version"></select>
  </div>
  <select id="lang" aria-label="Language"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select>
</header>

<main class="work">
  <section class="stage" id="stage">
    <div class="labels" id="labels"></div>
    <div class="view-controls">
      <div class="group"><span class="lbl" data-i18n="detail">細節</span><div class="seg" id="levels" role="group"></div></div>
      <div class="group"><span class="lbl" data-i18n="layers">層</span><div class="seg" id="layerToggles" role="group"></div></div>
    </div>
    <div class="overlay">
      <div class="mode" id="mode"><span class="dot"></span><span id="modeText"></span>
        <button class="btn" id="discard" hidden data-i18n="discard">放棄調整</button>
        <button class="btn primary" id="save" hidden data-i18n="save">另存為新版本</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>
  <aside>
    <section class="panel" id="changesPanel">
      <h2 id="changesTitle"></h2>
      <div id="risk"></div>
      <div class="counts" id="counts"></div>
      <ul class="changes" id="changeList"></ul>
    </section>
    <section class="panel" id="inspector">
      <h2 data-i18n="inspector">元件</h2>
      <div id="inspectBody"></div>
    </section>
    <p class="note" data-i18n="footnote">範例資料（虛構的早餐店點餐系統）。這個原型的版本只存在這個頁面裡，重新整理就會回到初始狀態。</p>
  </aside>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { diffGraphs, edgesAtLevel, withPositions } from "./graph-diff.mjs";
import { SAMPLE_VERSIONS } from "./sample-versions.mjs";

// ---------- i18n ----------
const I18N = {
  "zh-TW": {
    title: "架構視圖", version: "版本", compare: "比較", detail: "細節", layers: "層",
    lv1: "概觀", lv2: "服務", lv3: "元件",
    network: "網路", code: "程式", data: "資料",
    readonly: "舊版本，唯讀", editable: "最新版本：拖曳元件調整版面", dirty: "版面已調整，尚未存成新版本", comparing: "比較模式，唯讀",
    save: "另存為新版本", discard: "放棄調整", inspector: "元件",
    changesCompare: (b, t) => `${b} → ${t} 的變更`, changesNone: "版本說明",
    added: "新增", removed: "移除", changed: "修改", moved: "移動",
    noChanges: "兩個版本沒有差異。", hiddenAt: "目前細節層級未顯示",
    pickHint: "點選元件看細節。", kind: "類型", layer: "層", props: "屬性", links: "連線", parent: "所屬",
    riskTitle: "這次變更需要人工審查", riskExposure: "會對外暴露：", author: "作者",
    footnote: "範例資料（虛構的早餐店點餐系統）。這個原型的版本只存在這個頁面裡，重新整理就會回到初始狀態。",
    layoutNote: "版面調整", edgeChanged: "連線", position: "位置",
    kinds: { ingress: "Ingress", service: "Service", netpol: "NetworkPolicy", app: "應用程式", module: "模組", database: "資料庫", table: "資料表", queue: "佇列" },
  },
  en: {
    title: "Architecture view", version: "Version", compare: "Compare", detail: "Detail", layers: "Layers",
    lv1: "Overview", lv2: "Services", lv3: "Components",
    network: "Network", code: "Code", data: "Data",
    readonly: "Older version, read-only", editable: "Latest version: drag components to rearrange", dirty: "Layout changed, not saved as a version yet", comparing: "Comparing, read-only",
    save: "Save as new version", discard: "Discard changes", inspector: "Component",
    changesCompare: (b, t) => `Changes ${b} → ${t}`, changesNone: "Version notes",
    added: "Added", removed: "Removed", changed: "Changed", moved: "Moved",
    noChanges: "No differences between these versions.", hiddenAt: "hidden at this detail level",
    pickHint: "Select a component to see details.", kind: "Kind", layer: "Layer", props: "Properties", links: "Connections", parent: "Part of",
    riskTitle: "This change needs human review", riskExposure: "Exposes externally: ", author: "Author",
    footnote: "Example data (a fictional breakfast-shop ordering system). Versions in this prototype live only in this page and reset on reload.",
    layoutNote: "Layout change", edgeChanged: "Connection", position: "Position",
    kinds: { ingress: "Ingress", service: "Service", netpol: "NetworkPolicy", app: "Application", module: "Module", database: "Database", table: "Table", queue: "Queue" },
  },
  ja: {
    title: "アーキテクチャビュー", version: "バージョン", compare: "比較", detail: "詳細度", layers: "レイヤー",
    lv1: "概要", lv2: "サービス", lv3: "コンポーネント",
    network: "ネットワーク", code: "コード", data: "データ",
    readonly: "旧バージョン（読み取り専用）", editable: "最新バージョン：ドラッグで配置を変更", dirty: "配置を変更済み（未保存）", comparing: "比較中（読み取り専用）",
    save: "新しいバージョンとして保存", discard: "変更を破棄", inspector: "コンポーネント",
    changesCompare: (b, t) => `${b} → ${t} の変更`, changesNone: "バージョンの説明",
    added: "追加", removed: "削除", changed: "変更", moved: "移動",
    noChanges: "差分はありません。", hiddenAt: "この詳細度では非表示",
    pickHint: "コンポーネントを選択すると詳細を表示します。", kind: "種類", layer: "レイヤー", props: "属性", links: "接続", parent: "所属",
    riskTitle: "この変更には人によるレビューが必要です", riskExposure: "外部公開：", author: "作成者",
    footnote: "サンプルデータ（架空の朝食店注文システム）。このプロトタイプのバージョンはこのページ内だけに保持され、再読み込みで初期状態に戻ります。",
    layoutNote: "配置変更", edgeChanged: "接続", position: "位置",
    kinds: { ingress: "Ingress", service: "Service", netpol: "NetworkPolicy", app: "アプリ", module: "モジュール", database: "データベース", table: "テーブル", queue: "キュー" },
  },
};

// ---------- state ----------
const LAYERS = ["network", "code", "data"];
const LAYER_Y = { network: 8, code: 4, data: 0 };
const PLANE = { w: 20, d: 13 };
const MARK = { added: "+", removed: "−", changed: "~", moved: "↔" };

const state = {
  versions: SAMPLE_VERSIONS.map((v) => structuredClone(v)),
  current: 2,
  compare: true,
  base: 1,
  level: 1,
  lang: "zh-TW",
  show: { network: true, code: true, data: true },
  draft: new Map(), // node id -> {x, z}, only on the latest version
  selected: null,
};
try { const l = localStorage.getItem("laoban.viewer.lang"); if (l && I18N[l]) state.lang = l; } catch {}

const t = (k) => I18N[state.lang][k] ?? I18N.en[k] ?? k;
const isLatest = () => state.current === state.versions.length - 1;
const editable = () => isLatest() && !state.compare;
const cur = () => state.versions[state.current];

// ---------- three.js setup ----------
const stage = document.getElementById("stage");
const labelsEl = document.getElementById("labels");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: labelsEl });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
camera.position.set(19, 12, 23);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
controls.enableDamping = !reduceMotion;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8; controls.maxDistance = 60;

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(8, 20, 10);
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  labelRenderer.setSize(r.width, r.height);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

let colors = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const get = (n) => new THREE.Color(cs.getPropertyValue(n).trim() || "#888");
  colors = Object.fromEntries(
    ["layer-network", "layer-code", "layer-data", "added", "removed", "changed", "moved", "edge", "line", "accent", "muted"].map((n) => [n, get(`--${n}`)]),
  );
}

// ---------- geometry per kind ----------
const GEOM = {
  ingress: () => new THREE.OctahedronGeometry(0.75),
  service: () => new THREE.CylinderGeometry(0.55, 0.55, 0.5, 24),
  netpol: () => new THREE.TorusGeometry(0.6, 0.12, 10, 32).rotateX(Math.PI / 2),
  app: () => new THREE.BoxGeometry(1.6, 0.8, 1.1),
  module: () => new THREE.BoxGeometry(0.9, 0.45, 0.7),
  database: () => new THREE.CylinderGeometry(0.85, 0.85, 1.1, 32),
  table: () => new THREE.BoxGeometry(1.0, 0.3, 0.75),
  queue: () => new THREE.CapsuleGeometry(0.35, 0.9, 6, 16).rotateZ(Math.PI / 2),
};
const HEIGHT = { ingress: 0.75, service: 0.25, netpol: 0.12, app: 0.4, module: 0.22, database: 0.55, table: 0.15, queue: 0.35 };

// ---------- model for the current view ----------
function viewModel() {
  const target = cur();
  if (state.compare) {
    const base = state.versions[state.base];
    const d = diffGraphs(base, target);
    const nodes = d.nodes.map((x) => ({ ...x.node, status: x.status, changes: x.changes, before: x.before }));
    const edges = d.edges.map((x) => ({ ...x.edge, status: x.status, before: x.before }));
    return { nodes, edges, diff: d, base, target };
  }
  const nodes = target.nodes.map((n) => {
    const p = state.draft.get(n.id);
    return { ...n, pos: p ? { ...p } : n.pos, status: p ? "moved" : "none", changes: [] };
  });
  return { nodes, edges: target.edges.map((e) => ({ ...e, status: "none" })), diff: null, target };
}

const EDGE_PRIORITY = ["removed", "added", "changed", "unchanged", "none"];
function mergedStatus(sources) {
  for (const s of EDGE_PRIORITY) if (sources.some((e) => e.status === s)) return s;
  return "none";
}

// ---------- scene build ----------
const meshes = new Map(); // id -> mesh
let vm = null;

function disposeGroup(g) {
  g.traverse((o) => {
    o.geometry?.dispose?.();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    if (o.isCSS2DObject) o.element.remove();
  });
  g.clear();
}

function nodeColor(n) {
  if (state.compare && n.status !== "unchanged") return colors[n.status] ?? colors.muted;
  if (n.status === "moved") return colors.moved;
  return colors[`layer-${n.layer}`];
}

function makeLabel(text, cls) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text; // never innerHTML: names may come from AI output
  return new CSS2DObject(el);
}

function build() {
  readColors();
  disposeGroup(world);
  meshes.clear();
  vm = viewModel();
  const visible = vm.nodes.filter((n) => n.detail <= state.level && state.show[n.layer]);
  const visibleIds = new Set(visible.map((n) => n.id));

  // layer planes
  for (const layer of LAYERS) {
    if (!state.show[layer]) continue;
    const y = LAYER_Y[layer];
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(PLANE.w, PLANE.d).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: colors[`layer-${layer}`], transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide }),
    );
    plane.position.y = y;
    plane.userData.layer = layer;
    world.add(plane);
    const border = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(PLANE.w, PLANE.d).rotateX(-Math.PI / 2)),
      new THREE.LineBasicMaterial({ color: colors[`layer-${layer}`], transparent: true, opacity: 0.5 }),
    );
    border.position.y = y;
    world.add(border);
    const lbl = makeLabel(t(layer), "layer-label");
    lbl.position.set(PLANE.w / 2 - 0.6, y + 0.05, PLANE.d / 2 - 0.4);
    world.add(lbl);
  }

  // nodes
  for (const n of visible) {
    const mat = new THREE.MeshStandardMaterial({
      color: nodeColor(n), roughness: 0.55, metalness: 0.05,
      transparent: n.status === "removed", opacity: n.status === "removed" ? 0.35 : 1,
    });
    const mesh = new THREE.Mesh((GEOM[n.kind] ?? GEOM.module)(), mat);
    mesh.position.set(n.pos.x, LAYER_Y[n.layer] + HEIGHT[n.kind], n.pos.z);
    mesh.userData = { id: n.id, layer: n.layer, kind: n.kind };
    world.add(mesh);
    meshes.set(n.id, mesh);

    const st = state.compare && MARK[n.status] ? MARK[n.status] : n.status === "moved" ? MARK.moved : "";
    const lbl = makeLabel("", `node-label ${state.compare || n.status === "moved" ? n.status : ""}${state.selected === n.id ? " sel" : ""}`);
    if (st) { const s = document.createElement("span"); s.className = "st"; s.textContent = st; lbl.element.append(s); }
    lbl.element.append(document.createTextNode(n.name));
    lbl.position.set(0, HEIGHT[n.kind] + 0.2, 0);
    mesh.add(lbl);
  }

  buildEdges(visibleIds);
  renderPanels();
}

const edgeGroup = new THREE.Group();
function buildEdges() {
  disposeGroup(edgeGroup);
  world.add(edgeGroup);
  const shown = vm.nodes.filter((n) => state.show[n.layer]);
  const lifted = edgesAtLevel(shown, vm.edges, state.level);
  for (const e of lifted) {
    const a = meshes.get(e.from), b = meshes.get(e.to);
    if (!a || !b) continue;
    const status = mergedStatus(e.sources);
    const p0 = a.position.clone(), p2 = b.position.clone();
    const mid = p0.clone().add(p2).multiplyScalar(0.5);
    if (a.userData.layer === b.userData.layer) mid.y += 1.2;
    const curve = new THREE.QuadraticBezierCurve3(p0, mid, p2);
    const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(32));
    const color = state.compare && status !== "unchanged" ? colors[status] : colors.edge;
    const mat = status === "removed"
      ? new THREE.LineDashedMaterial({ color, dashSize: 0.3, gapSize: 0.2 })
      : new THREE.LineBasicMaterial({ color, transparent: true, opacity: e.lifted ? 0.55 : 0.9 });
    const line = new THREE.Line(geo, mat);
    if (status === "removed") line.computeLineDistances();
    edgeGroup.add(line);
    // direction marker at 75%
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color }));
    tip.position.copy(curve.getPoint(0.75));
    edgeGroup.add(tip);
    const text = e.sources.map((s) => s.label).filter(Boolean)[0];
    if (text && state.level >= 2) {
      const l = makeLabel(text, "edge-label");
      l.position.copy(curve.getPoint(0.5));
      edgeGroup.add(l);
    }
  }
}

// ---------- panels ----------
const $ = (id) => document.getElementById(id);

function kindName(k) { return t("kinds")[k] ?? k; }

function exposureFindings(d) {
  if (!d) return [];
  const out = [];
  for (const n of d.nodes) {
    if (n.status === "removed" && n.node.kind === "netpol") out.push(`NetworkPolicy ${n.node.name} ${t("removed")}`);
    if (n.status === "added" && n.node.kind === "ingress") out.push(`Ingress ${n.node.name} ${t("added")}`);
    if (n.status === "changed" && n.node.kind === "service") {
      const c = n.changes.find((x) => x.field === "props.type");
      if (c && ["LoadBalancer", "NodePort"].includes(c.after)) out.push(`Service ${n.node.name} → ${c.after}`);
    }
  }
  return out;
}

function lockIcon() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 10 12"); svg.setAttribute("width", "8"); svg.setAttribute("height", "10");
  svg.setAttribute("class", "lock"); svg.setAttribute("aria-hidden", "true");
  const body = document.createElementNS(NS, "rect");
  body.setAttribute("x", "1"); body.setAttribute("y", "5"); body.setAttribute("width", "8"); body.setAttribute("height", "6"); body.setAttribute("rx", "1"); body.setAttribute("fill", "currentColor");
  const arc = document.createElementNS(NS, "path");
  arc.setAttribute("d", "M3 5V3.5a2 2 0 0 1 4 0V5"); arc.setAttribute("fill", "none"); arc.setAttribute("stroke", "currentColor"); arc.setAttribute("stroke-width", "1.4");
  svg.append(arc, body);
  return svg;
}

function renderPanels() {
  document.documentElement.lang = state.lang === "zh-TW" ? "zh-Hant-TW" : state.lang;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  document.title = `laoban ${t("title")}`;

  // toolbar: versions
  const vs = $("versions"); vs.replaceChildren();
  state.versions.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "ver"; b.textContent = v.label;
    b.setAttribute("aria-pressed", String(i === state.current));
    b.title = v.note?.[state.lang] ?? "";
    if (i !== state.versions.length - 1) { b.append(lockIcon()); b.setAttribute("aria-label", `${v.label} (${t("readonly")})`); }
    b.onclick = () => selectVersion(i);
    vs.append(b);
  });
  const base = $("base"); base.replaceChildren();
  state.versions.forEach((v, i) => {
    if (i === state.current) return;
    const o = document.createElement("option"); o.value = i; o.textContent = `vs ${v.label}`; o.selected = i === state.base; base.append(o);
  });
  base.disabled = !state.compare || base.options.length === 0;
  $("compare").checked = state.compare;
  $("compare").disabled = state.versions.length < 2;

  const lv = $("levels"); lv.replaceChildren();
  [1, 2, 3].forEach((n) => {
    const b = document.createElement("button"); b.textContent = t(`lv${n}`);
    b.setAttribute("aria-pressed", String(n === state.level));
    b.onclick = () => { state.level = n; build(); };
    lv.append(b);
  });
  const lt = $("layerToggles"); lt.replaceChildren();
  for (const layer of LAYERS) {
    const b = document.createElement("button"); b.textContent = t(layer);
    b.setAttribute("aria-pressed", String(state.show[layer]));
    b.onclick = () => { state.show[layer] = !state.show[layer]; build(); };
    lt.append(b);
  }
  $("lang").value = state.lang;

  // mode
  const mode = $("mode");
  const dirty = state.draft.size > 0;
  mode.className = `mode ${editable() ? (dirty ? "dirty" : "edit") : ""}`;
  $("modeText").textContent = state.compare ? t("comparing") : !isLatest() ? t("readonly") : dirty ? t("dirty") : t("editable");
  $("save").hidden = !(editable() && dirty);
  $("discard").hidden = !(editable() && dirty);

  // legend
  const lg = $("legend"); lg.replaceChildren();
  const items = state.compare ? ["added", "removed", "changed", "moved"] : LAYERS;
  for (const k of items) {
    const s = document.createElement("span"); const i = document.createElement("i");
    i.style.background = `var(--${state.compare ? k : `layer-${k}`})`;
    s.append(i, document.createTextNode(t(k))); lg.append(s);
  }

  renderChanges();
  renderInspector();
}

function renderChanges() {
  const list = $("changeList"); list.replaceChildren();
  $("risk").replaceChildren(); $("counts").replaceChildren();
  if (!state.compare) {
    $("changesTitle").textContent = t("changesNone");
    const v = cur();
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = `${v.label}：${v.note?.[state.lang] ?? ""}`;
    const a = document.createElement("p"); a.className = "note"; a.textContent = `${t("author")}：${v.author}`;
    list.append(p, a);
    return;
  }
  const d = vm.diff;
  $("changesTitle").textContent = t("changesCompare")(state.versions[state.base].label, cur().label);

  const risks = exposureFindings(d);
  if (risks.length) {
    const r = document.createElement("div"); r.className = "risk";
    const s = document.createElement("strong"); s.textContent = t("riskTitle");
    r.append(s, document.createTextNode(t("riskExposure") + risks.join("、")));
    $("risk").append(r);
  }
  for (const k of ["added", "removed", "changed", "moved"]) {
    if (!d.summary[k]) continue;
    const c = document.createElement("span"); c.className = `chip ${k}`; c.textContent = `${MARK[k]}${d.summary[k]} ${t(k)}`;
    $("counts").append(c);
  }
  const rows = d.nodes.filter((n) => n.status !== "unchanged");
  const edgeRows = d.edges.filter((e) => e.status !== "unchanged");
  if (!rows.length && !edgeRows.length) {
    const p = document.createElement("p"); p.className = "empty"; p.textContent = t("noChanges"); list.append(p); return;
  }
  for (const n of rows) {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.className = n.status;
    const m = document.createElement("span"); m.className = "mark"; m.textContent = MARK[n.status];
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = `${kindName(n.node.kind)} ${n.node.name}`;
    const h = document.createElement("span"); h.className = "hint";
    h.textContent = n.node.detail > state.level ? t("hiddenAt") : n.changes.map((c) => c.field.replace("props.", "")).join(", ");
    b.append(m, nm, h);
    b.onclick = () => { if (n.node.detail > state.level) state.level = n.node.detail; state.show[n.node.layer] = true; state.selected = n.id; build(); };
    li.append(b); list.append(li);
  }
  const byId = new Map(vm.nodes.map((n) => [n.id, n]));
  for (const e of edgeRows) {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.className = e.status;
    const m = document.createElement("span"); m.className = "mark"; m.textContent = MARK[e.status];
    const nm = document.createElement("span"); nm.className = "name";
    nm.textContent = `${byId.get(e.edge.from)?.name ?? e.edge.from} → ${byId.get(e.edge.to)?.name ?? e.edge.to}`;
    const h = document.createElement("span"); h.className = "hint";
    h.textContent = e.status === "changed" ? `${e.before.label ?? ""} → ${e.edge.label ?? ""}` : e.edge.kind;
    b.append(m, nm, h);
    b.onclick = () => { state.selected = e.edge.from; build(); };
    li.append(b); list.append(li);
  }
}

function renderInspector() {
  const body = $("inspectBody"); body.replaceChildren();
  const n = vm.nodes.find((x) => x.id === state.selected);
  if (!n) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t("pickHint"); body.append(p); return; }
  const h = document.createElement("p"); h.className = "inspect-title"; h.textContent = n.name;
  const dl = document.createElement("dl"); dl.className = "kv";
  const row = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); if (v instanceof Node) dd.append(v); else dd.textContent = v; dl.append(dt, dd); };
  row(t("kind"), kindName(n.kind));
  row(t("layer"), t(n.layer));
  if (n.parent) row(t("parent"), vm.nodes.find((x) => x.id === n.parent)?.name ?? n.parent);
  const changed = new Map((n.changes ?? []).map((c) => [c.field, c]));
  for (const [k, v] of Object.entries(n.props ?? {})) {
    const c = changed.get(`props.${k}`);
    if (c) {
      const s = document.createElement("span"); s.className = "delta";
      const del = document.createElement("del"); del.textContent = String(c.before ?? "—");
      const ins = document.createElement("ins"); ins.textContent = String(c.after ?? "—");
      s.append(del, document.createTextNode(" → "), ins); row(k, s);
    } else row(k, String(v));
  }
  for (const c of n.changes ?? []) {
    if (c.field.startsWith("props.") && c.after === undefined) {
      const s = document.createElement("span"); s.className = "delta";
      const del = document.createElement("del"); del.textContent = String(c.before); s.append(del); row(c.field.slice(6), s);
    }
  }
  const links = vm.edges.filter((e) => e.from === n.id || e.to === n.id).map((e) => {
    const other = vm.nodes.find((x) => x.id === (e.from === n.id ? e.to : e.from));
    return `${e.from === n.id ? "→" : "←"} ${other?.name ?? "?"} (${e.kind}${e.label ? ` ${e.label}` : ""})`;
  });
  if (links.length) row(t("links"), links.join("\n"));
  body.append(h, dl);
}

// ---------- interaction ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let drag = null;

function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...meshes.values()], false);
  return hits[0]?.object ?? null;
}

renderer.domElement.addEventListener("pointerdown", (ev) => {
  const obj = pick(ev);
  if (!obj) return;
  state.selected = obj.userData.id;
  if (editable()) {
    controls.enabled = false;
    const y = obj.position.y;
    drag = { obj, plane: new THREE.Plane(new THREE.Vector3(0, 1, 0), -y), moved: false, pointerId: ev.pointerId };
    renderer.domElement.setPointerCapture(ev.pointerId);
  }
  for (const m of meshes.values()) m.children[0]?.element.classList.toggle("sel", m === obj);
  renderInspector();
});

renderer.domElement.addEventListener("pointermove", (ev) => {
  if (!drag) { renderer.domElement.style.cursor = pick(ev) ? (editable() ? "grab" : "pointer") : ""; return; }
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(drag.plane, p)) return;
  const x = Math.max(-PLANE.w / 2 + 0.8, Math.min(PLANE.w / 2 - 0.8, p.x));
  const z = Math.max(-PLANE.d / 2 + 0.8, Math.min(PLANE.d / 2 - 0.8, p.z));
  drag.obj.position.x = Math.round(x * 2) / 2;
  drag.obj.position.z = Math.round(z * 2) / 2;
  drag.moved = true;
  renderer.domElement.style.cursor = "grabbing";
  const node = vm.nodes.find((n) => n.id === drag.obj.userData.id);
  node.pos = { x: drag.obj.position.x, z: drag.obj.position.z };
  buildEdges();
});

function endDrag() {
  if (!drag) return;
  controls.enabled = true;
  if (drag.moved) {
    const id = drag.obj.userData.id;
    const orig = cur().nodes.find((n) => n.id === id).pos;
    const pos = { x: drag.obj.position.x, z: drag.obj.position.z };
    if (pos.x === orig.x && pos.z === orig.z) state.draft.delete(id); else state.draft.set(id, pos);
    drag = null;
    build();
  } else drag = null;
}
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

function selectVersion(i) {
  if (state.draft.size && i !== state.current) state.draft.clear();
  state.current = i;
  if (state.base === i) state.base = i > 0 ? i - 1 : 1;
  if (state.versions.length < 2) state.compare = false;
  build();
}

$("compare").onchange = (e) => {
  state.compare = e.target.checked;
  if (state.compare) { state.draft.clear(); if (state.base === state.current) state.base = state.current > 0 ? state.current - 1 : 1; }
  build();
};
$("base").onchange = (e) => { state.base = Number(e.target.value); build(); };
$("lang").onchange = (e) => { state.lang = e.target.value; try { localStorage.setItem("laoban.viewer.lang", state.lang); } catch {} build(); };
$("discard").onclick = () => { state.draft.clear(); build(); };
$("save").onclick = () => {
  const n = state.versions.length + 1;
  const note = { "zh-TW": I18N["zh-TW"].layoutNote, en: I18N.en.layoutNote, ja: I18N.ja.layoutNote };
  const v = withPositions(cur(), state.draft, { id: `v${n}`, label: `v${n}`, author: "local://u-you", note });
  state.versions.push(v);
  state.draft.clear();
  state.base = state.current;
  state.current = state.versions.length - 1;
  build();
};

// theme changes (system or explicit toggle) re-read the color tokens
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", build);
new MutationObserver(build).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

resize();
build();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
