name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        # Only x86-64 and ARM64 are supported targets.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Build and test inside SUSE BCI rather than on the Ubuntu host.
    container: registry.suse.com/bci/rust:1.98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          grep PRETTY_NAME /etc/os-release
          cargo --version && cargo fmt --version && cargo clippy --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  viewer:
    runs-on: ubuntu-24.04
    container: registry.suse.com/bci/nodejs:22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version
      - run: node --test web/viewer-prototype/*.test.mjs

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Backend Helm chart (charts/laoban) and CRD chart (charts/laoban-crd).
  # The UI extension chart (laoban-ext) is generated by the extension build
  # tooling and is not checked here.
  chart:
    runs-on: ubuntu-24.04
    env:
      # Rancher Prime 2.15.2 supports Kubernetes v1.34 to v1.36;
      # validate against the lowest supported minor.
      KUBE_VERSION: 1.34.0
      # Fleet version shipped with Rancher v2.15.2 (rancher/rancher build.yaml
      # fleetVersion 110.0.2+up0.16.2); checksum of its fleet-crd crds.yaml.
      FLEET_VERSION: v0.16.2
      FLEET_CRDS_SHA256: 537a2f9e675a530715f2c4814e8f0b5069b5cfb931ba2defed8f4458e32e54dd
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      K3S_VERSION: v1.34.12+k3s1
      K3S_SHA256: ef1df26b26276c0f6d962391c94e12f9362d1f1e30ec7a7926e9ddb84b0d66ce
      LAOBAN_API: laoban.yansheng133.github.io/v1alpha1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm version
          kubeconform -v
      - name: helm lint
        # ci-values.yaml requires the CRDs, which lint cannot fake in the
        # cluster's capabilities; the template step below covers it with
        # --api-versions. m0-values.yaml is the M0 install (no CRDs needed).
        run: |
          helm lint charts/laoban -f charts/laoban/ci/ci-values.yaml \
            --kube-version "${KUBE_VERSION}" --set crds.required=false
          helm lint charts/laoban -f charts/laoban/ci/m0-values.yaml \
            --kube-version "${KUBE_VERSION}"
          helm lint charts/laoban-crd --kube-version "${KUBE_VERSION}"
      - name: helm template
        run: |
          mkdir -p rendered
          helm template laoban charts/laoban -n laoban-system \
            -f charts/laoban/ci/ci-values.yaml \
            --kube-version "${KUBE_VERSION}" --api-versions "${LAOBAN_API}" > rendered/laoban.yaml
          helm template laoban charts/laoban -n laoban-system \
            -f charts/laoban/ci/m0-values.yaml \
            --kube-version "${KUBE_VERSION}" > rendered/laoban-m0.yaml
          helm template laoban-crd charts/laoban-crd -n laoban-system \
            --kube-version "${KUBE_VERSION}" > rendered/laoban-crd.yaml
      - name: Rendering fails without required values
        run: |
          check() {
            local want="$1"; shift
            if out=$(helm template laoban charts/laoban -n laoban-system --kube-version "${KUBE_VERSION}" "$@" 2>&1); then
              echo "rendering unexpectedly succeeded: $*"; exit 1
            fi
            grep -qF "$want" <<< "$out" || { echo "expected '$want', got:"; echo "$out"; exit 1; }
          }
          ci=(-f charts/laoban/ci/ci-values.yaml --api-versions "${LAOBAN_API}")
          m0=(-f charts/laoban/ci/m0-values.yaml)
          check "image.digest is required" "${ci[@]}" --set image.digest=
          check "image.digest is required" "${m0[@]}" --set image.digest=
          check "anthropic.existingSecret is required" "${m0[@]}" --set anthropic.existingSecret=
          check "github.existingSecret is required" "${m0[@]}" --set github.existingSecret=
          check "github.repo is required" "${m0[@]}" --set github.repo=
          check "config.model is required" "${m0[@]}" --set config.model=
          # CRDs: required by ci-values.yaml, and by M0 only when switched on.
          check "install the laoban-crd chart first" -f charts/laoban/ci/ci-values.yaml
          check "install the laoban-crd chart first" "${m0[@]}" --set crds.required=true
          check "persistence.storageClass is required" "${ci[@]}" --set persistence.storageClass=
          check "persistence.storageClass is required" "${m0[@]}" --set persistence.enabled=true --set persistence.storageClass=
      - name: M0 render has no RBAC, no PVC and no ServiceAccount token
        run: |
          kinds() { grep -E '^kind: ' "$1" | sort | uniq -c; }
          echo "M0:"; kinds rendered/laoban-m0.yaml
          echo "ci:"; kinds rendered/laoban.yaml
          if grep -qE '^kind: (ClusterRole|ClusterRoleBinding|Role|RoleBinding|PersistentVolumeClaim)$' rendered/laoban-m0.yaml; then
            echo "M0 render must not contain RBAC objects or a PVC"; exit 1
          fi
          [ "$(grep -c 'automountServiceAccountToken: false' rendered/laoban-m0.yaml)" -eq 2 ] \
            || { echo "M0: expected automountServiceAccountToken: false on the ServiceAccount and the pod"; exit 1; }
          for v in ANTHROPIC_API_KEY LAOBAN_MODEL LAOBAN_TOKEN_CAP LAOBAN_GITHUB_REPO LAOBAN_GITHUB_TOKEN LAOBAN_TARGET_NAMESPACE LAOBAN_CLUSTER_ID; do
            grep -q "name: ${v}$" rendered/laoban-m0.yaml || { echo "M0: env ${v} missing"; exit 1; }
          done
          grep -A1 'name: LAOBAN_TOKEN_CAP$' rendered/laoban-m0.yaml | grep -q 'value: "2000000"' \
            || { echo "M0: LAOBAN_TOKEN_CAP must render as \"2000000\""; exit 1; }
          # The full-featured render must still contain what M0 leaves out.
          for k in ClusterRole ClusterRoleBinding PersistentVolumeClaim; do
            grep -q "^kind: ${k}$" rendered/laoban.yaml || { echo "ci render: ${k} missing"; exit 1; }
          done
      - name: kubeconform (backend chart, deploy/m0)
        # The upstream schema set has no schema for CustomResourceDefinition
        # itself or for Fleet's kinds, so the CRD chart and the Fleet objects
        # are checked against a real API server below.
        run: |
          kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}" rendered/laoban.yaml rendered/laoban-m0.yaml
          kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}" -skip GitRepo,GitRepoRestriction deploy/m0
      - name: Start k3s API server
        run: |
          curl -fsSL -o /tmp/k3s "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION/+/%2B}/k3s"
          echo "${K3S_SHA256}  /tmp/k3s" | sha256sum -c -
          sudo install -m 0755 /tmp/k3s /usr/local/bin/k3s
          sudo k3s server --disable-agent --write-kubeconfig-mode 0644 \
            --disable traefik,servicelb,metrics-server,local-storage,coredns \
            > /tmp/k3s.log 2>&1 &
          for _ in $(seq 1 120); do
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml k3s kubectl get --raw /readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          tail -50 /tmp/k3s.log; exit 1
      - name: CRDs against a real API server
        run: charts/laoban-crd/ci/test-crds.sh rendered/laoban-crd.yaml
        env:
          KUBECTL: k3s kubectl
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      - name: Backend manifests server-side dry run
        run: |
          k3s kubectl apply --dry-run=server -f rendered/laoban.yaml
          k3s kubectl apply --dry-run=server -f rendered/laoban-m0.yaml
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      - name: deploy/m0 against a real API server
        # Fleet CRDs of the Fleet version Rancher v2.15.2 ships (v0.16.2).
        run: |
          curl -fsSL -o /tmp/fleet-crds.yaml \
            "https://raw.githubusercontent.com/rancher/fleet/${FLEET_VERSION}/charts/fleet-crd/templates/crds.yaml"
          echo "${FLEET_CRDS_SHA256}  /tmp/fleet-crds.yaml" | sha256sum -c -
          deploy/m0/ci/test-m0.sh /tmp/fleet-crds.yaml
        env:
          KUBECTL: k3s kubectl
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  extension:
    runs-on: ubuntu-24.04
    # @rancher/shell 3.0.13 requires Node.js >= 24 (package.json "engines").
    container: registry.suse.com/bci/nodejs:24
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          grep PRETTY_NAME /etc/os-release
          node --version && npm --version
      # Rancher extension docs install Yarn 1 globally with npm; pin the
      # version @rancher/shell 3.0.13 itself depends on.
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn build-pkg laoban-ext
      - run: yarn test
