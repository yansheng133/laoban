name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        # Only x86-64 and ARM64 are supported targets.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Build and test inside SUSE BCI rather than on the Ubuntu host.
    container: registry.suse.com/bci/rust:1.98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          grep PRETTY_NAME /etc/os-release
          cargo --version && cargo fmt --version && cargo clippy --version
      - run: cargo fmt --all -- --check
      # Findings are also written as annotations, readable without the
      # job log.
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt; then
            grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt \
              | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/' || true
            exit 1
          fi
      - run: cargo test --workspace

  viewer:
    runs-on: ubuntu-24.04
    container: registry.suse.com/bci/nodejs:22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version
      - run: node --test web/viewer-prototype/*.test.mjs

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Backend Helm chart (charts/laoban) and CRD chart (charts/laoban-crd).
  # The UI extension chart (laoban-ext) is generated by the extension build
  # tooling and is not checked here.
  chart:
    runs-on: ubuntu-24.04
    env:
      # Rancher Prime 2.15.2 supports Kubernetes v1.34 to v1.36;
      # validate against the lowest supported minor.
      KUBE_VERSION: 1.34.0
      # Fleet version shipped with Rancher v2.15.2 (rancher/rancher build.yaml
      # fleetVersion 110.0.2+up0.16.2); checksum of its fleet-crd crds.yaml.
      FLEET_VERSION: v0.16.2
      FLEET_CRDS_SHA256: 537a2f9e675a530715f2c4814e8f0b5069b5cfb931ba2defed8f4458e32e54dd
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      K3S_VERSION: v1.34.12+k3s1
      K3S_SHA256: ef1df26b26276c0f6d962391c94e12f9362d1f1e30ec7a7926e9ddb84b0d66ce
      LAOBAN_API: laoban.yansheng133.github.io/v1alpha1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm version
          kubeconform -v
      - name: Chart version matches the backend release
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          chart_version="$(sed -n 's/^version: //p' charts/laoban/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/laoban/Chart.yaml)"
          echo "Cargo ${cargo_version}, chart ${chart_version}, appVersion ${app_version}"
          if [ "$chart_version" != "$cargo_version" ] || [ "$app_version" != "$cargo_version" ]; then
            echo "::error::charts/laoban/Chart.yaml version/appVersion must equal the Cargo workspace version ${cargo_version}"
            exit 1
          fi
      - name: helm lint
        # ci-values.yaml requires the CRDs, which lint cannot fake in the
        # cluster's capabilities; the template step below covers it with
        # --api-versions. m0-values.yaml is the M0 install (no CRDs needed).
        # Errors are also annotations, readable without the job log.
        run: |
          lint() {
            if ! out=$(helm lint "$@" 2>&1); then
              echo "$out"
              grep -E 'ERROR|Error' <<< "$out" | head -5 | while read -r l; do echo "::error::helm lint: $l"; done
              exit 1
            fi
            echo "$out"
          }
          lint charts/laoban -f charts/laoban/ci/ci-values.yaml \
            --kube-version "${KUBE_VERSION}" --set crds.required=false
          lint charts/laoban -f charts/laoban/ci/m0-values.yaml \
            --kube-version "${KUBE_VERSION}"
          lint charts/laoban -f charts/laoban/ci/m0-values.yaml \
            -f charts/laoban/ci/m0-local-model-values.yaml --kube-version "${KUBE_VERSION}"
          lint charts/laoban-crd --kube-version "${KUBE_VERSION}"
      - name: helm template
        run: |
          mkdir -p rendered
          helm template laoban charts/laoban -n laoban-system \
            -f charts/laoban/ci/ci-values.yaml \
            --kube-version "${KUBE_VERSION}" --api-versions "${LAOBAN_API}" > rendered/laoban.yaml
          helm template laoban charts/laoban -n laoban-system \
            -f charts/laoban/ci/m0-values.yaml \
            --kube-version "${KUBE_VERSION}" > rendered/laoban-m0.yaml
          helm template laoban charts/laoban -n laoban-system \
            -f charts/laoban/ci/m0-values.yaml -f charts/laoban/ci/m0-local-model-values.yaml \
            --kube-version "${KUBE_VERSION}" > rendered/laoban-m0-local.yaml
          helm template laoban-crd charts/laoban-crd -n laoban-system \
            --kube-version "${KUBE_VERSION}" > rendered/laoban-crd.yaml
          for crd in rounds plans tokenusages; do
            grep -q "name: ${crd}.laoban.yansheng133.github.io" rendered/laoban-crd.yaml \
              || { echo "::error::laoban-crd must contain the ${crd} CRD"; exit 1; }
          done
      - name: Rendering fails without required values
        run: |
          check() {
            local want="$1"; shift
            if out=$(helm template laoban charts/laoban -n laoban-system --kube-version "${KUBE_VERSION}" "$@" 2>&1); then
              echo "rendering unexpectedly succeeded: $*"; exit 1
            fi
            grep -qF "$want" <<< "$out" || { echo "expected '$want', got:"; echo "$out"; echo "::error::expected '$want', got: $(head -c 300 <<< "$out" | tr '\n' ' ')"; exit 1; }
          }
          ci=(-f charts/laoban/ci/ci-values.yaml --api-versions "${LAOBAN_API}")
          m0=(-f charts/laoban/ci/m0-values.yaml)
          check "image.digest is required" "${ci[@]}" --set image.digest=
          check "image.digest is required" "${m0[@]}" --set image.digest=
          check "anthropic.existingSecret is required" "${m0[@]}" --set anthropic.existingSecret=
          check "github.existingSecret is required" "${m0[@]}" --set github.existingSecret=
          check "github.repo is required" "${m0[@]}" --set github.repo=
          check "config.model is required" "${m0[@]}" --set config.model=
          check "config.clusterId is required" "${m0[@]}" --set config.clusterId=
          # CRDs: required by ci-values.yaml, and by M0 only when switched on.
          check "install the laoban-crd chart first" -f charts/laoban/ci/ci-values.yaml
          check "install the laoban-crd chart first" "${m0[@]}" --set crds.required=true
          check "persistence.storageClass is required" "${ci[@]}" --set persistence.storageClass=
          check "persistence.storageClass is required" "${m0[@]}" --set persistence.enabled=true --set persistence.storageClass=
          local=("${m0[@]}" -f charts/laoban/ci/m0-local-model-values.yaml)
          check "ai.baseUrl must be scheme, host and optional port only" "${local[@]}" --set ai.baseUrl=http://192.0.2.1:11434/v1/messages
          check "ai.baseUrl must be scheme, host and optional port only" "${local[@]}" --set ai.baseUrl=ftp://192.0.2.1
          check "ai.timeoutSeconds must be between 30 and 1800" "${local[@]}" --set ai.timeoutSeconds=10
          check "ai.timeoutSeconds must be between 30 and 1800" "${m0[@]}" --set ai.timeoutSeconds=3600
          # Round limits may only be lowered.
          check "rounds.limits.opinionChars may only be lowered" "${m0[@]}" --set rounds.limits.opinionChars=1001
          check "rounds.limits.roundChars may only be lowered" "${m0[@]}" --set rounds.limits.roundChars=0
          check "rounds.limits.replies may only be lowered" "${m0[@]}" --set-string rounds.limits.replies=many
          check "rounds.limits.replyChars may only be lowered" "${m0[@]}" --set-json 'rounds.limits.replyChars=2.5'
      - name: Local-model render has no Anthropic key and points at the endpoint
        run: |
          f=rendered/laoban-m0-local.yaml
          if grep -q 'name: ANTHROPIC_API_KEY$' "$f"; then echo "local-model render must not inject ANTHROPIC_API_KEY"; exit 1; fi
          grep -A1 'name: LAOBAN_AI_BASE_URL$' "$f" | grep -q 'value: "http://192.168.128.1:11434"' \
            || { echo "LAOBAN_AI_BASE_URL missing or wrong"; exit 1; }
          grep -A1 'name: LAOBAN_AI_TIMEOUT_SECONDS$' "$f" | grep -q 'value: "900"' \
            || { echo "LAOBAN_AI_TIMEOUT_SECONDS must render as \"900\""; exit 1; }
          # The Anthropic render keeps the key and has no base URL.
          grep -q 'name: ANTHROPIC_API_KEY$' rendered/laoban-m0.yaml || { echo "M0: ANTHROPIC_API_KEY missing"; exit 1; }
          if grep -q 'name: LAOBAN_AI_BASE_URL$' rendered/laoban-m0.yaml; then echo "M0: unexpected LAOBAN_AI_BASE_URL"; exit 1; fi
      - name: M0 render has only the aggregated API's RBAC and no PVC
        # M0 serves the API as an aggregated API (docs/m0-design.md, 身分):
        # the backend may read the request-header ConfigMap and its own Round
        # resources in its namespace, nothing else; users get ClusterRoles
        # for this API group only. No impersonation.
        run: |
          # Failures are also annotations, readable without the job log.
          fail() { echo "::error::$1"; exit 1; }
          kinds() { grep -E '^kind: ' "$1" | sort | uniq -c; }
          echo "M0:"; kinds rendered/laoban-m0.yaml
          echo "ci:"; kinds rendered/laoban.yaml
          f=rendered/laoban-m0.yaml
          if grep -qE '^kind: (ClusterRoleBinding|PersistentVolumeClaim)$' "$f"; then
            fail "M0 render must not contain ClusterRoleBindings or a PVC"
          fi
          if grep -q 'impersonate' "$f"; then fail "M0 render must not grant impersonate"; fi
          # One Role: Round, Plan and TokenUsage objects in laoban-system, nothing else.
          [ "$(grep -c '^kind: Role$' "$f")" -eq 1 ] || fail "M0: expected exactly one Role (rounds)"
          role=$(awk '/^kind: Role$/{c=1} /^---/{c=0} c' "$f")
          grep -q 'namespace: laoban-system' <<< "$role" || fail "M0: the Role must be in laoban-system"
          [ "$(grep -c 'apiGroups:' <<< "$role")" -eq 1 ] || fail "M0: the Role must have one rule"
          grep -q 'apiGroups: \["laoban.yansheng133.github.io"\]' <<< "$role" || fail "M0: the Role must cover laoban's CRD group only"
          grep -q 'resources: \["rounds", "plans", "tokenusages"\]' <<< "$role" || fail "M0: the Role must cover rounds, plans and tokenusages only"
          if grep -qE '"(\*|patch|watch|deletecollection|escalate|bind)"' <<< "$role"; then fail "M0: unexpected verbs in the Role"; fi
          [ "$(grep -c '^kind: RoleBinding$' "$f")" -eq 2 ] || fail "M0: expected exactly two RoleBindings"
          awk '/^kind: RoleBinding$/{c=1} /^---/{c=0} c' "$f" | grep -q 'namespace: kube-system' \
            || fail "M0: one RoleBinding must be in kube-system"
          awk '/^kind: RoleBinding$/{c=1} /^---/{c=0} c' "$f" | grep -q 'name: extension-apiserver-authentication-reader' \
            || fail "M0: a RoleBinding must bind extension-apiserver-authentication-reader"
          awk '/^kind: RoleBinding$/{c=1} /^---/{c=0} c' "$f" | grep -q 'name: laoban-state' \
            || fail "M0: a RoleBinding must bind the rounds Role"
          # Lowered round limits reach the backend; unset ones are not passed.
          if grep -q 'LAOBAN_ROUND_MAX_' "$f"; then fail "M0: no round limits unless set"; fi
          helm template laoban charts/laoban -n laoban-system --kube-version "${KUBE_VERSION}" \
            -f charts/laoban/ci/m0-values.yaml --set rounds.limits.opinionChars=500 > /tmp/limits.yaml
          grep -A1 'name: LAOBAN_ROUND_MAX_OPINION_CHARS$' /tmp/limits.yaml | grep -q 'value: "500"' \
            || fail "M0: rounds.limits.opinionChars must render as LAOBAN_ROUND_MAX_OPINION_CHARS=\"500\""
          [ "$(grep -c 'LAOBAN_ROUND_MAX_' /tmp/limits.yaml)" -eq 1 ] || fail "M0: only the set limit is passed"
          [ "$(grep -c '^kind: ClusterRole$' "$f")" -eq 2 ] || fail "M0: expected the two laoban-api ClusterRoles"
          if awk '/^kind: ClusterRole$/{c=1} /^---/{c=0} c && /apiGroups:/' "$f" | grep -v 'api.laoban.yansheng133.github.io' | grep -q .; then
            fail "M0: user ClusterRoles may only cover api.laoban.yansheng133.github.io"
          fi
          grep -q '^kind: APIService$' "$f" || fail "M0: APIService missing"
          grep -A20 '^kind: APIService$' "$f" | grep -q 'caBundle: ' || fail "M0: APIService needs a caBundle"
          if grep -q 'insecureSkipTLSVerify' "$f"; then fail "M0: no insecureSkipTLSVerify"; fi
          grep -q 'name: LAOBAN_TLS_CERT_FILE$' "$f" || fail "M0: TLS env missing"
          for v in ANTHROPIC_API_KEY LAOBAN_MODEL LAOBAN_TOKEN_CAP LAOBAN_GITHUB_REPO LAOBAN_GITHUB_TOKEN LAOBAN_TARGET_NAMESPACE LAOBAN_CLUSTER_ID LAOBAN_LANGUAGE; do
            grep -q "name: ${v}$" "$f" || fail "M0: env ${v} missing"
          done
          grep -A1 'name: LAOBAN_TOKEN_CAP$' "$f" | grep -q 'value: "2000000"' \
            || fail "M0: LAOBAN_TOKEN_CAP must render as \"2000000\""
          grep -A1 'name: LAOBAN_LANGUAGE$' "$f" | grep -q 'value: "en"' \
            || fail "M0: LAOBAN_LANGUAGE must default to \"en\""
          # The full-featured render must still contain what M0 leaves out.
          for k in ClusterRole ClusterRoleBinding PersistentVolumeClaim; do
            grep -q "^kind: ${k}$" rendered/laoban.yaml || fail "ci render: ${k} missing"
          done
      - name: Rancher project roles match the chart's user roles
        # deploy/rancher/roletemplate.yaml must give Project members the same
        # rules as laoban-api-edit / laoban-api-view.
        run: |
          python3 - <<'PY'
          import re, sys
          def docs(text):
              return [d for d in text.split("\n---\n") if "kind:" in d]
          def rules(doc):
              res = set(re.findall(r"^\s+- ([a-z/]+)$", doc, re.M))
              inline = re.findall(r'resources: \[([^\]]*)\]', doc)
              for line in inline:
                  res |= {x.strip().strip('"') for x in line.split(",")}
              verbs = re.findall(r'verbs: \[([^\]]*)\]', doc)
              return res, {v.strip().strip('"') for v in verbs[0].split(",")}
          # Project members also need to read the app's Deployments (B26);
          # edit/view have that already, so the chart has no such rule.
          DEPLOY_RULE = '  - apiGroups: ["apps"]\n    resources: ["deployments"]\n    verbs: ["get", "list", "watch"]\n'
          rt = [d + "\n" for d in docs(open("deploy/rancher/roletemplate.yaml").read())]
          for d in rt:
              if DEPLOY_RULE not in d:
                  print("::error::each RoleTemplate must read Deployments (get, list, watch)")
                  sys.exit(1)
          rt = [d.replace(DEPLOY_RULE, "") for d in rt]
          chart = open("rendered/laoban-m0.yaml").read()
          roles = {}
          for d in docs(chart):
              m = re.search(r"^kind: ClusterRole$", d, re.M)
              n = re.search(r"^  name: (laoban-api-\w+)$", d, re.M)
              if m and n:
                  roles[n.group(1)] = rules(d)
          want = {"laoban-user": roles["laoban-api-edit"], "laoban-viewer": roles["laoban-api-view"]}
          for d in rt:
              name = re.search(r"^  name: (\S+)$", d, re.M).group(1)
              got = rules(d)
              if got != want[name]:
                  print(f"::error::{name} differs from the chart: {got} vs {want[name]}")
                  sys.exit(1)
              print(name, "matches")
          PY
      - name: kubeconform (backend chart, deploy/m0)
        # The upstream schema set has no schema for CustomResourceDefinition
        # itself or for Fleet's kinds, so the CRD chart and the Fleet objects
        # are checked against a real API server below.
        run: |
          kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}" rendered/laoban.yaml rendered/laoban-m0.yaml rendered/laoban-m0-local.yaml
          kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}" -skip GitRepo,GitRepoRestriction deploy/m0
      - name: Start k3s API server
        run: |
          curl -fsSL -o /tmp/k3s "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION/+/%2B}/k3s"
          echo "${K3S_SHA256}  /tmp/k3s" | sha256sum -c -
          sudo install -m 0755 /tmp/k3s /usr/local/bin/k3s
          sudo k3s server --disable-agent --write-kubeconfig-mode 0644 \
            --disable traefik,servicelb,metrics-server,local-storage,coredns \
            > /tmp/k3s.log 2>&1 &
          for _ in $(seq 1 120); do
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml k3s kubectl get --raw /readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          tail -50 /tmp/k3s.log; exit 1
      - name: CRDs against a real API server
        run: charts/laoban-crd/ci/test-crds.sh rendered/laoban-crd.yaml
        env:
          KUBECTL: k3s kubectl
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      - name: Backend manifests server-side dry run
        run: |
          k3s kubectl apply --dry-run=server -f rendered/laoban.yaml
          k3s kubectl apply --dry-run=server -f rendered/laoban-m0.yaml
          k3s kubectl apply --dry-run=server -f rendered/laoban-m0-local.yaml
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      - name: deploy/m0 against a real API server
        # Fleet CRDs of the Fleet version Rancher v2.15.2 ships (v0.16.2).
        run: |
          curl -fsSL -o /tmp/fleet-crds.yaml \
            "https://raw.githubusercontent.com/rancher/fleet/${FLEET_VERSION}/charts/fleet-crd/templates/crds.yaml"
          echo "${FLEET_CRDS_SHA256}  /tmp/fleet-crds.yaml" | sha256sum -c -
          deploy/m0/ci/test-m0.sh /tmp/fleet-crds.yaml
        env:
          KUBECTL: k3s kubectl
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  extension:
    runs-on: ubuntu-24.04
    # @rancher/shell 3.0.13 requires Node.js >= 24 (package.json "engines").
    container: registry.suse.com/bci/nodejs:24
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          grep PRETTY_NAME /etc/os-release
          node --version && npm --version
      # Rancher extension docs install Yarn 1 globally with npm; pin the
      # version @rancher/shell 3.0.13 itself depends on.
      - run: npm install -g yarn@1.22.22
      - name: Extension version matches the release version
        # The publish workflow tags the extension laoban-ext-<version>.
        run: |
          ext="$(node -p "require('./pkg/laoban-ext/package.json').version")"
          cargo="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' ../Cargo.toml)"
          [ "$ext" = "$cargo" ] || { echo "::error::extension version $ext is not Cargo.toml's $cargo"; exit 1; }
      - run: yarn install --frozen-lockfile
      - run: yarn build-pkg laoban-ext
      - run: yarn test
