name: image

# Builds the laoban-server container image natively on x86-64 and ARM64
# runners (no QEMU, no cross-compiling; only these two architectures are
# supported).
#
# - pull_request: build both architectures, load locally, smoke-test. No push.
# - tag v* / manual run: build both architectures, push each by digest to
#   Docker Hub, smoke-test the pushed digest, then merge into one multi-arch
#   manifest list, sign it with cosign v2 keyless (GitHub OIDC), attach an
#   SPDX SBOM per architecture as a cosign attestation, and verify both.
#
# Owner configuration (Settings > Secrets and variables > Actions):
#   vars.DOCKERHUB_NAMESPACE   Docker Hub user or organization
#   secrets.DOCKERHUB_USERNAME Docker Hub user for the access token
#   secrets.DOCKERHUB_TOKEN    Docker Hub access token (Read & Write)
# See build/README.md.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/laoban-server
  # cosign v2 only: NeuVector verifies cosign v2 signatures, not the v3
  # bundle format. Latest v2 release per `git ls-remote --tags
  # https://github.com/sigstore/cosign` at the time of writing.
  COSIGN_RELEASE: v2.6.5
  SYFT_VERSION: v1.54.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Check registry configuration
        if: github.event_name != 'pull_request'
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          HAS_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=""
          [ -n "$NAMESPACE" ] || missing="$missing vars.DOCKERHUB_NAMESPACE"
          [ "$HAS_USER" = "true" ] || missing="$missing secrets.DOCKERHUB_USERNAME"
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secrets.DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository configuration:$missing (see build/README.md)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version for image label
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # Pull request: build into the local Docker image store and smoke-test.
      - name: Build (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.ver.outputs.version }}
          provenance: false
          sbom: false
          load: true
          push: false
          tags: laoban-server:smoke

      - name: Smoke test (local image)
        if: github.event_name == 'pull_request'
        run: build/smoke-test.sh laoban-server:smoke "$GITHUB_SHA"

      # Release: push by digest only; tags are added in the merge job.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.ver.outputs.version }}
          # Keep each digest a plain image manifest; the SBOM is attached
          # with cosign in the merge job instead of as a BuildKit attestation.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test (pushed digest)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: build/smoke-test.sh "${IMAGE}@${DIGEST}" "$GITHUB_SHA"

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      # Keyless signing: the GitHub OIDC token is exchanged for a short-lived
      # Fulcio certificate bound to this workflow. Nothing else is needed:
      # artifacts from the same run download with the runtime token.
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Deploy by digest; tags are for humans. No floating "latest".
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, got $count"
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t sources < <(for d in *; do echo "${IMAGE}@sha256:${d}"; done)
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no index digest"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Check cosign major version
        run: |
          cosign version
          cosign version --json | jq -e '.gitVersion | startswith("v2.")' >/dev/null

      - name: Sign manifest list and platform manifests
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        # --recursive also signs each platform manifest, so a verifier that
        # resolves the per-architecture digest finds a signature too.
        # --new-bundle-format=false is the v2 default; it is stated so that a
        # version bump cannot silently switch to the bundle format.
        run: cosign sign --yes --recursive --new-bundle-format=false "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate SBOMs and attach as attestations
        id: sbom
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          : > "$RUNNER_TEMP/platforms.txt"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | "\(.platform.os)-\(.platform.architecture) \(.digest)"' \
            | while read -r plat pdigest; do
                out="$RUNNER_TEMP/sbom/laoban-server-${plat}.spdx.json"
                "$SYFT" scan "registry:${IMAGE}@${pdigest}" -o "spdx-json=${out}"
                cosign attest --yes --new-bundle-format=false --type spdxjson --predicate "$out" "${IMAGE}@${pdigest}"
                echo "$plat $pdigest" >> "$RUNNER_TEMP/platforms.txt"
              done
          [ "$(wc -l < "$RUNNER_TEMP/platforms.txt")" -eq 2 ]

      - name: Verify signature and attestations
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          while read -r plat pdigest; do
            cosign verify "${IMAGE}@${pdigest}" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            cosign verify-attestation "${IMAGE}@${pdigest}" --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "verified $plat $pdigest"
          done < "$RUNNER_TEMP/platforms.txt"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: ${{ runner.temp }}/sbom/*.spdx.json
          if-no-files-found: error

      - name: Job summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "## laoban-server image"
            echo
            echo "Reference this in Helm values (by digest, not tag):"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "| Platform | Digest |"
            echo "|---|---|"
            while read -r plat pdigest; do echo "| ${plat} | \`${pdigest}\` |"; done < "$RUNNER_TEMP/platforms.txt"
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Signed with cosign ${COSIGN_RELEASE} (keyless). Workflow identity: \`https://github.com/${WORKFLOW_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
