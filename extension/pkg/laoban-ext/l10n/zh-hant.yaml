product:
  laoban: laoban

laoban:
  nav:
    dashboard: 總覽
  apps:
    title: 應用清單
    refresh: 重新整理
    empty: 還沒有任何應用。在上方輸入需求，部署後就會出現在這裡。
    loadFailed: 無法讀取應用清單，請稍後再試。
    legacy: 較早版本產生，沒有編輯紀錄，無法編輯。
    revisions: "共 {count} 個版本"
    open: 打開
    edit: 編輯
    col:
      name: 名稱
      summary: 摘要
      updated: 最後更新
      state: Fleet 狀態
      actions: 動作
    state:
      ready: 已就緒
      modified: 執行中（與 Git 不一致）
      pending: 部署中
      error: 部署錯誤
      missing: Fleet 尚未讀到
      unknown: "-"
  edit:
    title: "編輯：{appName}"
    history: 最近的修改
    kindCreate: 建立
    kindEdit: 修改
    cancel: 取消編輯，改成新增應用
    promptLabel: 要怎麼修改
    promptPlaceholder: 例如：加上飲料選項，訂單要能填備註
    generate: 產生修改計畫
    planTitle: "修改計畫：{appName}"
    currentArch: 目前的架構。產生修改計畫後會換成修改後的樣子。
  dashboard:
    title: laoban
    description: 用一句話描述需求，laoban 會先提出計畫與架構圖；確認後才產生程式、寫進 GitHub，再由 Fleet 部署。這是試吃版（M0）。
    config:
      model: 模型
      targetNamespace: 部署目標
      repo: 程式庫
      tokenBudget: Token 用量
      tokenUsage: "{used} / {cap}"
      unavailable: 無法讀取 laoban 後端設定。
    chat:
      title: 需求
      promptLabel: 想做什麼
      promptPlaceholder: 例如：做一個早餐店點餐頁面，可以選餐點和送出訂單
      appNameLabel: 應用名稱（選填）
      appNamePlaceholder: breakfast
      appNameHint: 小寫英文字母開頭，只能用小寫英文、數字與連字號，共 2～31 個字元。留空時由 AI 命名。
      generate: 產生計畫
    plan:
      title: "計畫：{appName}"
      steps: 步驟
      masked: "送出給 AI 前已遮蔽 {count} 處疑似敏感資訊。"
      usage: "這次用了 {input} 個輸入 token、{output} 個輸出 token。"
      apply: 確認並部署
    result:
      committed: 已寫進 GitHub：
      openApp: 打開應用
      badAppUrl: 後端回傳的應用網址格式不正確，無法顯示連結。
    arch:
      title: 架構圖
      empty: 產生計畫後，這裡會顯示應用的 3D 架構圖。
      hint: 拖曳旋轉，滾輪或雙指縮放。
      noWebgl: 這個瀏覽器無法使用 WebGL，無法顯示 3D 架構圖。元件清單請見下方。
      ariaLabel: "3D 架構圖，共 {count} 個元件"
      listTitle: "元件清單（{count}）"
      layers:
        network: 網路
        code: 程式
        data: 資料
    status:
      idle: 輸入需求後按「產生計畫」。
      planning: "AI 正在產生計畫，通常需要 30～60 秒（已 {seconds} 秒）…"
      planned: 計畫已產生。確認內容後按「確認並部署」。
      applying: "AI 正在產生程式並寫進 GitHub，通常需要 30～60 秒（已 {seconds} 秒）…"
      waitingBundle: "已寫進 GitHub，等待 Fleet 讀取這次變更（已 {seconds} 秒）…"
      deploying: "Fleet 部署中：{ready} / {desired} 就緒…"
      rollingOut: "Fleet 已套用，等新版本的 Pod 啟動（已 {seconds} 秒）…"
      bundleError: "Fleet 回報部署錯誤（{ready} / {desired} 就緒），仍持續確認中…"
      ready: 部署完成，可以打開應用。
      readyModified: "應用已部署並在執行，可以打開。但 Fleet 回報實際物件與 Git 內容不一致（Modified），細節請到 Continuous Delivery 的 {workspace} 工作區查看。"
      timeout: "等了 {minutes} 分鐘仍未就緒，已停止確認。請到 Continuous Delivery 的 {workspace} 工作區查看 Bundle 狀態。"
      pollFailed: 這次無法讀取 Fleet 狀態，5 秒後重試。
    errors:
      generic: 無法連線到 laoban 後端，請稍後再試。
      timeout: 等候 laoban 後端回應逾時，請稍後再試。
